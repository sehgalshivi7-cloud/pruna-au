<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pexels Documentary Shot Finder V2</title>
<style>
body{margin:0;background:#0d1117;color:#eee;font:15px system-ui;padding:14px}main{max-width:1100px;margin:auto}section{background:#151b23;border:1px solid #283241;border-radius:12px;padding:14px;margin:12px 0}textarea,input,select{width:100%;box-sizing:border-box;background:#0b1016;color:#eee;border:1px solid #384454;border-radius:8px;padding:10px;margin:6px 0}textarea{min-height:180px}button{background:#253142;color:#fff;border:1px solid #3b4858;border-radius:8px;padding:9px 12px;margin:4px;cursor:pointer}.primary{background:#62a8ff;color:#06111c}.good{background:#58d68d;color:#06150c}.shot{border:1px solid #303b49;border-radius:10px;padding:12px;margin:12px 0}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.clip{border:1px solid #303b49;border-radius:9px;overflow:hidden}.clip img,.clip video{width:100%;aspect-ratio:16/9;object-fit:cover;background:#000}.clipbody{padding:8px}.muted{color:#9aa6b5;font-size:12px}.q{display:inline-block;border:1px solid #303b49;border-radius:20px;padding:4px 7px;margin:3px;font-size:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.results{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}@media(max-width:430px){.results{grid-template-columns:1fr}}
</style></head><body><main>
<h2>🎬 Pexels Documentary Shot Finder V2</h2><div class="muted">Hindi/Hinglish narration → visual shots → Full HD landscape Pexels clips</div>
<section><b>Pexels API key</b><input id="key" type="password" placeholder="Paste your Pexels API key"><div class="muted">Stored only in this browser. Do not share it in chat.</div>
<div class="row"><label>Minimum<input value="1920×1080" disabled></label><label>Results<select id="per"><option>12</option><option selected>20</option><option>40</option><option>80</option></select></label></div></section>
<section><b>Paste your full narration</b><textarea id="script" placeholder="Paste your Hindi/Hinglish documentary narration here..."></textarea>
<button class="primary" id="make">Break into visual shots</button><button id="save">Save project</button><button id="load">Load project</button><button id="export">Export shot list</button><div id="status" class="muted"></div></section>
<div id="board"></div><section class="muted"><b>Pexels:</b> Keep Pexels/photographer attribution when using results.</section>
</main>
<script>
const $=s=>document.querySelector(s),board=$("#board"),status=$("#status");let p={shots:[]};$("#key").value=localStorage.getItem("pexelsKey")||"";$("#key").onchange=()=>localStorage.setItem("pexelsKey",$("#key").value.trim());
const esc=x=>String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function sentences(t){return t.replace(/\r/g,"").split(/(?<=[।!?])\s+|\n+/).map(x=>x.trim()).filter(x=>x.length>12)}
function analyze(s){let l=s.toLowerCase(),c="realistic documentary scene: "+s.slice(0,140);let rules=[[/track|monitor|निगरानी|नज़र/,"surveillance and observation"],[/follow|पीछा/,"person being followed"],[/meet|मिल|बैठ/,"secret meeting"],[/leave|निकला|बाहर/,"person leaving a building"],[/enter|अंदर|चढ़/,"person entering a place"],[/walk|चल|जाता|जाना/,"person walking"],[/drive|गाड़ी|बस|car/,"vehicle driving"],[/document|कागज़|फाइल|file/,"intelligence documents"],[/phone|फोन|call/,"secret phone call"],[/watch|देख|देखना/,"person watching from a distance"],[/night|रात/,"nighttime scene"]];for(const [r,v] of rules)if(r.test(l)){c=v+" — "+s.slice(0,120);break}let b=s.replace(/[^\p{L}\p{N}\s-]/gu," ").replace(/\s+/g," ").slice(0,80);return{visual:c,queries:[b+" realistic documentary footage",b+" surveillance street footage",b+" person observed from distance",b+" cinematic documentary footage"]}}
function render(){board.innerHTML="";p.shots.forEach((s,i)=>{let e=document.createElement("section");e.className="shot";e.innerHTML='<b style="color:#62a8ff">SHOT '+(i+1)+'</b><p>'+esc(s.text)+'</p><div class="muted">Visual: '+esc(s.visual)+'</div><div>'+s.queries.map(q=>'<span class="q">'+esc(q)+'</span>').join("")+'</div><button class="primary search">🔎 Search Pexels</button><button class="alt">🔄 Find alternative</button><div class="results"></div>';e.querySelector(".search").onclick=()=>search(s,e,false);e.querySelector(".alt").onclick=()=>search(s,e,true);board.appendChild(e);if(s.results)show(s,e)})}
function best(v){return (v.video_files||[]).filter(f=>f.file_type==="video/mp4"&&f.width>=1920&&f.height>=1080&&f.width/f.height>1.5).sort((a,b)=>b.width*b.height-a.width*a.height)[0]}
async function search(s,e,alt){let k=$("#key").value.trim();if(!k){status.textContent="Paste your Pexels API key first.";return}let q=(alt?s.queries.slice().reverse():s.queries)[(s.n||0)%4];s.n=(s.n||0)+1;status.textContent="Searching: "+q;try{let u=new URL("https://api.pexels.com/v1/videos/search");u.searchParams.set("query",q);u.searchParams.set("orientation","landscape");u.searchParams.set("size","medium");u.searchParams.set("per_page",$("#per").value);let r=await fetch(u,{headers:{Authorization:k}});if(!r.ok)throw Error("Pexels API "+r.status);let d=await r.json();s.results=(d.videos||[]).map(v=>{let f=best(v);return f?{id:v.id,url:v.url,image:v.image,duration:v.duration,width:f.width,height:f.height,fps:f.fps,link:f.link,creator:v.user?.name||"Unknown"}:null}).filter(Boolean);show(s,e);status.textContent="Found "+s.results.length+" Full HD+ landscape clips."}catch(x){status.textContent="Search failed: "+x.message}}
function show(s,e){let box=e.querySelector(".results");box.innerHTML="";(s.results||[]).forEach(v=>{let c=document.createElement("div");c.className="clip";c.innerHTML='<img src="'+esc(v.image)+'"><div class="clipbody"><b>'+v.width+'×'+v.height+'</b> · '+Number(v.fps||0).toFixed(2)+' fps · '+v.duration+'s<div class="muted">'+esc(v.creator)+'<br><a target="_blank" href="'+esc(v.url)+'">Pexels page</a></div><button class="good use">Use this clip</button><button class="preview">Preview</button></div>';c.querySelector(".use").onclick=()=>{s.selected=v;render();status.textContent="Clip assigned to shot "+(p.shots.indexOf(s)+1)};c.querySelector(".preview").onclick=()=>{let vid=document.createElement("video");vid.controls=true;vid.autoplay=true;vid.src=v.link;c.prepend(vid);c.querySelector("img").remove()};box.appendChild(c)})}
$("#make").onclick=()=>{let t=$("#script").value.trim();if(!t){status.textContent="Paste your narration first.";return}p.shots=sentences(t).map((text,i)=>{let a=analyze(text);return{id:Date.now()+"-"+i,text,visual:a.visual,queries:a.queries,results:null,selected:null}});render();status.textContent="Created "+p.shots.length+" shots."};
$("#save").onclick=()=>{localStorage.setItem("pexelsProjectV2",JSON.stringify({script:$("#script").value,p}));status.textContent="Project saved."};
$("#load").onclick=()=>{let x=localStorage.getItem("pexelsProjectV2");if(!x){status.textContent="No saved project.";return}let d=JSON.parse(x);$("#script").value=d.script||"";p=d.p;render();status.textContent="Project loaded."};
$("#export").onclick=()=>{let t=p.shots.map((s,i)=>"SHOT "+(i+1)+"\n"+s.text+"\nVisual: "+s.visual+"\nQueries: "+s.queries.join(" | ")+"\nSelected: "+(s.selected?.url||"NONE")+"\n").join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));a.download="pexels-shot-list.txt";a.click()}
</script></body></html>
