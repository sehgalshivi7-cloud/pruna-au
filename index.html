<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P-Video Generator</title><style>body{margin:0;background:#0d0e12;color:#eee;font-family:system-ui,sans-serif}main{max-width:760px;margin:auto;padding:20px}h1{margin-bottom:4px}.muted{color:#9da3ad}.card{background:#17191f;border:1px solid #292d35;border-radius:16px;padding:16px;margin:14px 0}label{display:block;margin:12px 0 6px;color:#c9ced8}input,textarea,select{width:100%;box-sizing:border-box;background:#0f1115;color:#fff;border:1px solid #343944;border-radius:10px;padding:12px;font-size:15px}textarea{min-height:150px;resize:vertical}button{background:#eee;color:#111;border:0;border-radius:10px;padding:12px 16px;font-weight:700;margin:8px 6px 0 0}button.secondary{background:#292d35;color:#eee}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.status{padding:12px;border-radius:10px;background:#101217;color:#cbd1dc;white-space:pre-wrap}.ok{color:#7fe2a0}.err{color:#ff8d8d}video{width:100%;border-radius:12px;margin-top:12px;background:#000}.small{font-size:13px}</style></head><body><main><h1>P-Video Generator</h1><div class="muted">Direct Pruna P-Video API • mobile friendly</div><div class="card"><label>Pruna API key</label><input id="key" type="password" placeholder="Paste your Pruna API key"><button id="save" class="secondary">Save key</button><button id="test" class="secondary">Test API</button><div id="keymsg" class="small muted"></div></div><div class="card"><label>Prompt</label><textarea id="prompt" placeholder="Describe the video shot..."></textarea><div class="row"><div><label>Resolution</label><select id="res"><option value="1080p">1080p</option><option value="720p">720p</option></select></div><div><label>Aspect ratio</label><select id="ar"><option value="16:9">16:9</option><option value="9:16">9:16</option><option value="4:3">4:3</option><option value="1:1">1:1</option></select></div></div><div class="row"><div><label>Duration</label><select id="dur"><option>5</option><option>6</option><option>8</option><option>10</option><option>15</option><option>20</option></select></div><div><label>FPS</label><select id="fps"><option>24</option><option>48</option></select></div></div><label>Optional reference image</label><input id="img" type="file" accept="image/jpeg,image/png,image/webp"><button id="generate">Generate P-Video</button><button id="clear" class="secondary">Clear</button></div><div class="card"><b>Status</b><div id="status" class="status" style="margin-top:10px">Ready.</div><div id="out"></div></div></main><script>
const $=s=>document.querySelector(s); const key=$('#key'), status=$('#status'), out=$('#out'), msg=$('#keymsg');
key.value=localStorage.getItem('pruna_api_key')||''; if(key.value) msg.textContent='Key saved locally.';
function setStatus(t,c=''){status.className='status '+c;status.textContent=t}
function getKey(){const k=key.value.trim()||localStorage.getItem('pruna_api_key'); if(!k) throw Error('Paste your Pruna API key first.'); return k}
$('#save').onclick=()=>{const k=key.value.trim();if(!k)return msg.textContent='Paste your key first.';localStorage.setItem('pruna_api_key',k);msg.textContent='Saved on this device.'}
async function api(path,opt={}){const k=getKey();const h=Object.assign({},opt.headers||{}, {'apikey':k});const r=await fetch('https://api.pruna.ai'+path,{...opt,headers:h});let data={};try{data=await r.json()}catch{} if(!r.ok) throw Error((data&&data.message)||('HTTP '+r.status+' '+r.statusText)); return data}
$('#test').onclick=async()=>{try{setStatus('Testing Pruna API…');await api('/v1/predictions/status/nonexistent');}catch(e){if(/404|not found/i.test(e.message)){setStatus('API connection reached Pruna successfully. Your key was accepted by the API.','ok')}else setStatus(e.message,'err')}};
async function upload(file){const k=getKey();const fd=new FormData();fd.append('content',file);const r=await fetch('https://api.pruna.ai/v1/files',{method:'POST',headers:{apikey:k},body:fd});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.message||('Upload HTTP '+r.status));return d.url||d.file_url||d.content_location||d}
function findUrl(d){return d.generation_url||d.output_url||d.url||d?.urls?.get||d?.output?.url||d?.output?.[0]?.url||null}
async function poll(id){for(let i=0;i<180;i++){const d=await api('/v1/predictions/status/'+encodeURIComponent(id));const s=String(d.status||d.state||'').toLowerCase();setStatus('Generation status: '+(d.status||d.state||'processing')+'\nCheck '+(i+1));const u=findUrl(d);if(u){setStatus('Generation complete.','ok');out.innerHTML='<video controls playsinline src="'+u+'"></video><div class="small" style="margin-top:8px;word-break:break-all">'+u+'</div>';return}if(['failed','error','canceled','cancelled'].includes(s))throw Error(d.error||d.message||'Generation failed');await new Promise(r=>setTimeout(r,5000))}throw Error('Timed out while waiting. Check the prediction in Pruna.');}
$('#generate').onclick=async()=>{out.innerHTML='';try{const p=$('#prompt').value.trim();if(!p)throw Error('Enter a prompt.');let imageUrl=null;const f=$('#img').files[0];if(f){setStatus('Uploading reference image…');imageUrl=await upload(f)}const input={prompt:p,duration:Number($('#dur').value),resolution:$('#res').value,aspect_ratio:$('#ar').value,fps:Number($('#fps').value)};if(imageUrl)input.image=imageUrl;setStatus('Submitting P-Video generation…');const d=await api('/v1/predictions',{method:'POST',headers:{'Content-Type':'application/json','Model':'p-video'},body:JSON.stringify({input})});const id=d.id||d.prediction_id;if(!id){const u=findUrl(d);if(u){setStatus('Generation complete.','ok');out.innerHTML='<video controls playsinline src="'+u+'"></video>';return}throw Error('Pruna did not return a prediction ID.')}setStatus('Submitted. Waiting for video…\nPrediction: '+id);await poll(id)}catch(e){setStatus(e.message,'err')}};
$('#clear').onclick=()=>{ $('#prompt').value='';$('#img').value='';out.innerHTML='';setStatus('Ready.')}
</script></body></html>
